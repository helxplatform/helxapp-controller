{{- if .Values.ldapPlugin.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helxapp-controller.ldapPlugin.fullname" . }}
  labels:
    {{- include "helxapp-controller.ldapPlugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ldapPlugin.replicaCount }}
  selector:
    matchLabels:
      {{- include "helxapp-controller.ldapPlugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ldap-plugin-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "helxapp-controller.ldapPlugin.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helxapp-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ldap-plugin
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.ldapPlugin.image.repository }}:{{ .Values.ldapPlugin.image.tag }}"
          imagePullPolicy: {{ .Values.ldapPlugin.image.pullPolicy }}
          ports:
            - name: ldap-proxy
              containerPort: {{ .Values.ldapPlugin.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: ldap-proxy
          readinessProbe:
            httpGet:
              path: /readyz
              port: ldap-proxy
          resources:
            {{- toYaml .Values.ldapPlugin.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: "/etc/config"
              readOnly: true
            - name: ldap-secret
              mountPath: "/etc/ldap-secret"
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "helxapp-controller.ldapPlugin.fullname" . }}-config
        - name: ldap-secret
          secret:
            secretName: {{ .Values.ldapPlugin.passwordSecret | default (printf "%s-ldap-pw" (include "helxapp-controller.fullname" .)) }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
